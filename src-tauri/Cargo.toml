[package]
name = "floatnotes"
version = "0.1.0"
description = "FloatNotes — floating markdown scratch notes"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floatnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs", "io-util"] }
notify = "8"
# Dev proxy to Vite (release serves the tauri-embedded dist/ instead — there is
# no dist/ on disk inside the .app bundle, so no tower-http ServeDir).
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
# `hyper::upgrade::on` — the dev proxy has to splice both halves of a 101 by
# hand (axum re-exports no equivalent). Already in the tree under axum.
hyper = "1"
# Git deps pinned by rev for reproducible builds (the study clone's unpinned
# branch refs are one of its documented mistakes).
tauri-plugin-global-shortcut = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1a0b7916501fd493dfe62bf227a8604eb8d05938" }

[target."cfg(target_os = \"macos\")".dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel.git", rev = "040fd1d9d0c69cb384fa53fe32f1a7a95f0f2cc0" }
# Login item (ADR 0003): SMAppService register/unregister. objc2 0.6 line,
# matching tauri-nspanel's re-exported objc2.
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

